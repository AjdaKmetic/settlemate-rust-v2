<div id="{{ panel_id }}" class="tab-panel">

    <div class="section-header">
        <h2>Uredi opis</h2>
    </div>

    <form
        class="inline-form"
        hx-post="/expenses/{{ expense.id }}/description?panel_id={{ panel_id }}&back_url={{ back_url }}&back_target={{ back_target }}&back_swap={{ back_swap }}"
        hx-target="#{{ panel_id }}"
        hx-swap="outerHTML"
    >
        <input
            type="text"
            name="description"
            value="{{ expense.description }}"
            required
        >

        <button
            type="submit"
            class="btn-create"
        >
            Shrani
        </button>

        {% if panel_id == "activity-panel" %}
            <button
                type="button"
                class="btn-cancel"
                hx-get="/tabs/activity"
                hx-target="#tab-shell"
                hx-swap="outerHTML"
            >
                Prekliči
            </button>
        {% else %}
            <button
                type="button"
                class="btn-cancel"
                hx-get="{{ back_url }}"
                hx-target="#friends-panel"
                hx-swap="outerHTML"
            >
                Prekliči
            </button>
        {% endif %}
    </form>

</div>
