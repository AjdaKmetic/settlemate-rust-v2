<div id="friends-panel" class="tab-panel">

    <div class="section-header">
        <h2>Prijatelji</h2>

        <button
            type="button"
            class="btn-create"
            hx-get="/friends/form"
            hx-target="#friends-panel"
            hx-swap="outerHTML"
        >
            + Dodaj prijatelja
        </button>
    </div>

    {% if friends.is_empty() %}

        <div class="empty-state">
            <p class="secondary-text">Nimaš še dodanih prijateljev.</p>
        </div>

    {% else %}

        {% for friend in friends %}

            <div class="list-row friend-row{% if loop.last %} last{% endif %}">

                <div class="friend-avatar">
                    {{ friend.name.chars().next().unwrap_or('?') }}
                </div>

                <div class="row-info">
                    <p class="row-title">
                        {{ friend.name }}
                    </p>

                    <p class="row-meta">
                        @{{ friend.username }}
                    </p>
                </div>

            </div>

        {% endfor %}

    {% endif %}

</div>
