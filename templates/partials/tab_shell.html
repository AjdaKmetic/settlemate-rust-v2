<div id="tab-shell">

    <div class="tab-list">

        <button
            class="tab-button {% if active_tab == "friends" %}active{% endif %}"
            hx-get="/tabs/friends"
            hx-target="#tab-shell"
            hx-swap="outerHTML"
        >
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            Prijatelji
        </button>

        <button
            class="tab-button {% if active_tab == "groups" %}active{% endif %}"
            hx-get="/tabs/groups"
            hx-target="#tab-shell"
            hx-swap="outerHTML"
        >
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Skupine
        </button>

        <button
            class="tab-button {% if active_tab == "activity" %}active{% endif %}"
            hx-get="/tabs/activity"
            hx-target="#tab-shell"
            hx-swap="outerHTML"
        >
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
            Aktivnost
        </button>

    </div>

    <div id="tab-content">

        {% if active_tab == "friends" %}

            {% include "partials/friends.html" %}

        {% else if active_tab == "groups" %}

            {% include "partials/groups.html" %}

        {% else if active_tab == "activity" %}

            {% include "partials/activity.html" %}

        {% endif %}

    </div>

</div>
