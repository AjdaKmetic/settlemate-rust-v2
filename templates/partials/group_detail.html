<div id="groups-panel" class="tab-panel">

    <div class="section-header">
        <h2>{{ group.name }}</h2>

        <div class="form-actions">
            <details class="account-menu">
                <summary class="nav-user" title="Nastavitve skupine" aria-label="Nastavitve skupine">
                    <span class="avatar">
                        <svg class="icon-text" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </span>
                </summary>

                <div class="account-dropdown">
                    <button
                        type="button"
                        class="account-menu-item"
                        hx-get="/groups/{{ group.id }}/leave/form"
                        hx-target="#modal-root"
                        hx-swap="innerHTML"
                    >
                        Zapusti skupino
                    </button>

                    <button
                        type="button"
                        class="account-menu-item"
                        hx-get="/groups/{{ group.id }}/delete/form"
                        hx-target="#modal-root"
                        hx-swap="innerHTML"
                    >
                        Izbriši skupino
                    </button>
                </div>
            </details>

            <button
                type="button"
                class="btn-cancel"
                hx-get="/tabs/groups"
                hx-target="#tab-shell"
                hx-swap="outerHTML"
            >
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Nazaj
            </button>

            <button
                type="button"
                class="btn-create"
                hx-get="/groups/{{ group.id }}/members/form"
                hx-target="#groups-panel"
                hx-swap="outerHTML"
            >
                + Dodaj člana
            </button>
        </div>
    </div>

    {% if members.is_empty() %}

        <div class="empty-state">
            <p class="secondary-text">Skupina še nima članov.</p>
        </div>

    {% else %}

        {% for member in members %}

            <div class="list-row{% if loop.last %} last{% endif %}">

                <div class="friend-avatar">
                    {{ member.name.chars().next().unwrap_or('?') }}
                </div>

                <div class="row-info">
                    <p class="row-title">
                        {{ member.name }}
                    </p>

                    <p class="row-meta">
                        @{{ member.username }}
                    </p>
                </div>

            </div>

        {% endfor %}

    {% endif %}

</div>
