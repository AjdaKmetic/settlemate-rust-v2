<div class="tab-panel">
    <div class="section-header">
        <h2>Aktivnost</h2>
    </div>

    {% if activities.is_empty() %}
        <div class="empty-state">
            <p class="secondary-text">Nimaš še zabeleženih stroškov.</p>
        </div>
    {% else %}
        {% for activity in activities %}
            <div class="list-row{% if loop.last %} last{% endif %}">
                <div class="activity-icon">
                    €
                </div>

                <div class="row-info">
                    <p class="row-title">
                        {{ activity.description }}
                    </p>

                    <p class="row-meta">
                        Plačnik: {{ activity.payer_label }}
                    </p>
                </div>

                <div class="row-balance is-neutral">
                    <p class="amount">
                        {{ activity.formatted_amount }}
                    </p>
                </div>
            </div>
        {% endfor %}
    {% endif %}
</div>
