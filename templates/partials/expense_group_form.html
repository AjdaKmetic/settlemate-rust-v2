<div class="modal-overlay">
    <section class="modal-card">
        <p class="auth-intro">
            Dodaj strošek
        </p>

        <div class="form-actions">
            <button
                type="button"
                class="btn-cancel"
                hx-get="/expenses/form"
                hx-target="#modal-root"
                hx-swap="innerHTML"
            >
                Z uporabniki
            </button>

            <button
                type="button"
                class="btn-create"
                disabled
            >
                S skupino
            </button>
        </div>

        {% if groups.is_empty() %}
            <p class="auth-error">
                Pred dodajanjem skupinskega stroška ustvari skupino.
            </p>

            <button
                type="button"
                class="btn-cancel"
                hx-get="/expenses/close"
                hx-target="#modal-root"
                hx-swap="innerHTML"
            >
                Zapri
            </button>
        {% else %}
            <form
                class="auth-form"
                method="post"
                action="/expenses"
            >
                <label>
                    Opis

                    <input
                        type="text"
                        name="description"
                        required
                    >
                </label>

                <label>
                    Znesek (€)

                    <input
                        type="text"
                        name="amount"
                        inputmode="decimal"
                        placeholder="0,00"
                        pattern="[0-9]+([,][0-9]{1,2})?"
                        title="Vnesi znesek, na primer 12,50."
                        required
                    >
                </label>

                <label>
                    Skupina

                    <select name="group_id" required>
                        <option value="" disabled selected>
                            Izberi skupino
                        </option>

                        {% for group in groups %}
                            <option value="{{ group.id }}">
                                {{ group.name }}
                            </option>
                        {% endfor %}
                    </select>
                </label>

                <div class="form-actions">
                    <button
                        type="button"
                        class="btn-cancel"
                        hx-get="/expenses/close"
                        hx-target="#modal-root"
                        hx-swap="innerHTML"
                    >
                        Prekliči
                    </button>

                    <button
                        type="submit"
                        class="btn-create"
                    >
                        Shrani strošek
                    </button>
                </div>
            </form>
        {% endif %}
    </section>
</div>
