{% include "partials/friends.html" %}

<div
    id="balance-card"
    class="balance-card {{ balance_state_class }}"
    hx-swap-oob="true"
>
    <div class="balance-icon">
        <svg
            class="icon-text"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
            <line x1="1" y1="10" x2="23" y2="10"/>
        </svg>
    </div>

    <div>
        <p class="balance-label">{{ balance_label }}</p>
        <p class="balance-amount">{{ formatted_balance }}</p>
    </div>
</div>
