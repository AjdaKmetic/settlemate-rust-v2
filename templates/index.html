<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SettleMate</title>

    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/htmx.org@2.0.8"></script>
</head>

<body>

    <nav class="navbar">
        <div class="nav-logo">
            <svg
                class="icon-text"
                width="26"
                height="26"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>

            <span class="nav-brand">SettleMate</span>
        </div>

        <details class="account-menu">
    <summary class="nav-user">
        <span class="avatar">
            <svg
                class="icon-text"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </span>

        <span class="nav-username">{{ username }}</span>

        <svg
            class="account-chevron"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
        >
            <path d="m6 9 6 6 6-6"/>
        </svg>
    </summary>

    <div class="account-dropdown">
        <a
            class="account-menu-item"
            href="/account"
        >
            Moj račun
        </a>
        <form method="post" action="/logout">
            <button
                class="account-menu-item"
                type="submit"
            >
                Odjava
            </button>
        </form>
    </div>
</details>
    </nav>

    <main class="container">

        <!-- skupno stanje -->

        <div class="balance-card {{ balance_state_class }}">
            <div class="balance-icon">
                <svg
                    class="icon-text"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
                    <line x1="1" y1="10" x2="23" y2="10"/>
                </svg>
            </div>

            <div>
                <p class="balance-label">{{ balance_label }}</p>
                <p class="balance-amount">{{ formatted_balance }}</p>
            </div>
        </div>

        <!-- zavihki in njihova vsebina -->

        {% include "partials/tab_shell.html" %}

    </main>

</body>
</html>
